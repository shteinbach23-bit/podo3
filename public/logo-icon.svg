<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c5f7c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5a8ca8;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="starGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c088;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d4a574;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9955f;stop-opacity:1" />
    </linearGradient>

    <filter id="starGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Curved arc (top left) -->
  <path d="M 30 50 Q 50 30 70 50" stroke="url(#footGradient)" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- Foot shape -->
  <ellipse cx="85" cy="120" rx="35" ry="55" fill="none" stroke="url(#footGradient)" stroke-width="6"/>

  <!-- Toes (5 circles) -->
  <circle cx="60" cy="75" r="7" fill="#2c5f7c"/>
  <circle cx="75" cy="68" r="7" fill="#2c5f7c"/>
  <circle cx="90" cy="65" r="7" fill="#2c5f7c"/>
  <circle cx="105" cy="68" r="7" fill="#2c5f7c"/>
  <circle cx="118" cy="75" r="6" fill="#2c5f7c"/>

  <!-- Calendar icon (right side) -->
  <rect x="130" y="130" width="45" height="50" rx="4" fill="none" stroke="#2c5f7c" stroke-width="4"/>
  <line x1="130" y1="142" x2="175" y2="142" stroke="#2c5f7c" stroke-width="4"/>

  <!-- Calendar grid -->
  <rect x="135" y="148" width="10" height="10" fill="#5a9fb8"/>
  <rect x="150" y="148" width="10" height="10" fill="#5a9fb8"/>
  <rect x="165" y="148" width="8" height="10" fill="#5a9fb8"/>

  <rect x="135" y="162" width="10" height="10" fill="#5a9fb8"/>
  <rect x="150" y="162" width="10" height="10" fill="#5a9fb8"/>

  <rect x="135" y="168" width="10" height="10" fill="#2c5f7c"/>

  <!-- Clock symbol -->
  <circle cx="165" cy="170" r="8" stroke="#2c5f7c" stroke-width="2" fill="none"/>
  <path d="M 165 165 L 165 170 L 169 173" stroke="#2c5f7c" stroke-width="1.5" fill="none"/>

  <!-- Star (8-pointed) -->
  <g filter="url(#starGlow)">
    <path d="M 100 20 L 105 35 L 120 35 L 108 44 L 113 59 L 100 50 L 87 59 L 92 44 L 80 35 L 95 35 Z" 
          fill="url(#starGradient)" opacity="0.95"/>
    <circle cx="100" cy="42" r="20" fill="#d4a574" opacity="0.2"/>
  </g>
</svg>